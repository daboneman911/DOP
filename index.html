<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Operating Plan Attendance</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
      --accent: #2563eb; --accent-hover: #1d4ed8;
      --border: #334155; --muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 16px; margin: 0; display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 500px; }
    h1 { font-size: 1.25rem; margin-bottom: 16px; text-align: center; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 8px; color: var(--muted); }
    select, button {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #0f172a; color: #fff; font-size: 1rem; box-sizing: border-box;
    }
    .roster-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .employee-btn {
      background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 12px;
      border-radius: 8px; cursor: pointer; font-weight: 500; text-align: left; display: flex; justify-content: space-between;
    }
    .employee-btn.present { background: #166534; border-color: #22c55e; color: #fff; }
    .stats { display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 12px; font-weight: bold; }
    .primary-btn { background: var(--accent); border: none; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .primary-btn:hover { background: var(--accent-hover); }
    .alert { background: #14532d; border: 1px solid #22c55e; color: #f0fdf4; padding: 10px; border-radius: 8px; text-align: center; display: none; margin-top: 10px; }
  </style>
</head>
<body>
<div class="container">
  <h1>DOP Attendance Dashboard</h1>

  <div class="card">
    <label for="dopSelect">Daily Operating Plan Target</label>
    <select id="dopSelect" onchange="calculate()">
      <option value="5">5-2 (Target: 5)</option>
      <option value="6">6-2 (Target: 6)</option>
      <option value="7">7-2 (Target: 7)</option>
    </select>
  </div>

  <div class="card">
    <label>Select Present Staff</label>
    <div class="roster-grid" id="roster"></div>
    <div class="stats">
      <span>Present: <span id="count">0</span></span>
      <span>Variance: <span id="variance">0</span></span>
    </div>
  </div>

  <button class="primary-btn" onclick="copyReport()">Copy Attendance Report</button>
  <div id="alert" class="alert">Copied to clipboard!</div>
</div>

<script>
  const staff = ["Tre", "Russell", "Matt", "Luis", "Elliot", "Pablo", "David", "Eddie", "Gilbert", "Solis", "Johnny", "Damian", "Albert"];
  const present = new Set();

  function init() {
    const grid = document.getElementById('roster');
    staff.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'employee-btn';
      btn.innerText = name;
      btn.onclick = () => {
        if (present.has(name)) { present.delete(name); btn.classList.remove('present'); }
        else { present.add(name); btn.classList.add('present'); }
        calculate();
      };
      grid.appendChild(btn);
    });
    calculate();
  }

  function calculate() {
    const target = parseInt(document.getElementById('dopSelect').value);
    const count = present.size;
    const diff = count - target;
    document.getElementById('count').innerText = count;
    document.getElementById('variance').innerText = (diff > 0 ? `+${diff}` : `${diff}`) + " vs Plan";
  }

  function copyReport() {
    const dopText = document.getElementById('dopSelect').selectedOptions[0].text;
    const target = parseInt(document.getElementById('dopSelect').value);
    const presentArr = Array.from(present);
    const absentArr = staff.filter(name => !present.has(name));
    const diff = presentArr.length - target;

    const report = `--- DAILY OPERATING PLAN ATTENDANCE ---
Date: ${new Date().toLocaleDateString()}
DOP Plan: ${dopText}

PRESENT (${presentArr.length}):
${presentArr.join('\n') || 'None'}

ABSENT / UNACCOUNTED (${absentArr.length}):
${absentArr.join('\n') || 'None'}

VARIANCE: ${diff > 0 ? '+' + diff : diff} vs DOP Target
--------------------------------------`;

    navigator.clipboard.writeText(report).then(() => {
      const alert = document.getElementById('alert');
      alert.style.display = 'block';
      setTimeout(() => alert.style.display = 'none', 2000);
    });
  }

  init();
</script>
</body>
</html>
