<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Operating Plan Attendance</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
      --accent: #2563eb; --border: #334155; --muted: #94a3b8;
      --good: #22c55e; --good-bg: #166534; --short: #f87171; --over: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 16px; margin: 0;
      display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 500px; }
    h1 { font-size: 1.25rem; margin: 0 0 16px; text-align: center; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 8px; color: var(--muted); }
    select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: #fff; font-size: 1rem; }

    .roster-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .employee-btn {
      background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 12px;
      border-radius: 8px; cursor: pointer; font-weight: 500; text-align: left; font-size: 1rem;
    }
    .employee-btn.present { background: var(--good-bg); border-color: var(--good); color: #fff; }
    .roster-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .ghost-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 10px; border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 600;
    }
    .ghost-btn:hover { color: var(--text); border-color: var(--muted); }

    /* Live tally */
    .tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .tally div { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 12px 6px; }
    .tally .k { font-size: .7rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .tally .v { font-size: 1.75rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .v.is-good { color: var(--good); } .v.is-short { color: var(--short); } .v.is-over { color: var(--over); }
    .status { text-align: center; margin-top: 12px; font-weight: 600; font-size: .95rem; }
    .breakdown { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 6px; }

    .list-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
    .name-list { margin: 0 0 14px; padding: 0; list-style: none; font-size: .95rem; line-height: 1.6; }
    .name-list:last-child { margin-bottom: 0; }
    .name-list li::before { content: "• "; color: var(--muted); }
    .name-list .empty { color: var(--muted); font-style: italic; }
    .name-list .empty::before { content: ""; }
    .meta { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
<div class="container">
  <h1>DOP Attendance Dashboard</h1>

  <div class="card">
    <label for="dopSelect">Daily Operating Plan</label>
    <select id="dopSelect">
      <option value="5-2">5-2 — 5 unloaders + 2 bulk sweeps (7)</option>
      <option value="6-2">6-2 — 6 unloaders + 2 bulk sweeps (8)</option>
      <option value="7-2" selected>7-2 — 7 unloaders + 2 bulk sweeps (9)</option>
    </select>
  </div>

  <div class="card">
    <label>Select Present Staff</label>
    <div class="roster-grid" id="roster"></div>
    <div class="roster-actions">
      <button class="ghost-btn" id="markAll">Mark all present</button>
      <button class="ghost-btn" id="clearAll">Clear</button>
    </div>
  </div>

  <div class="card">
    <div class="tally">
      <div><div class="k">Required</div><div class="v" id="vRequired">9</div></div>
      <div><div class="k">Present</div><div class="v" id="vPresent">0</div></div>
      <div><div class="k">Variance</div><div class="v" id="vVariance">0</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="breakdown" id="breakdown"></div>
  </div>

  <div class="card">
    <p class="list-title">Present (<span id="cPresent">0</span>)</p>
    <ul class="name-list" id="listPresent"></ul>
    <p class="list-title">Absent / Unaccounted (<span id="cAbsent">0</span>)</p>
    <ul class="name-list" id="listAbsent"></ul>
    <div class="meta" id="stamp"></div>
  </div>
</div>

<script>
  var STAFF = ["Tre", "Russell", "Matt", "Luis", "Elliot", "Pablo", "David", "Eddie", "Gilbert", "Solis", "Johnny", "Damian", "Albert"];
  // A plan is written unloaders-sweeps, so 7-2 requires 7 + 2 = 9 people on the floor.
  var PLANS = {
    "5-2": { unloaders: 5, sweeps: 2 },
    "6-2": { unloaders: 6, sweeps: 2 },
    "7-2": { unloaders: 7, sweeps: 2 }
  };

  var present = new Set();
  var selectEl = document.getElementById('dopSelect');
  var rosterEl = document.getElementById('roster');

  function requiredFor(key) {
    var p = PLANS[key];
    return p ? p.unloaders + p.sweeps : 0;
  }

  function fill(listEl, names) {
    listEl.innerHTML = '';
    if (!names.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'None';
      listEl.appendChild(li);
      return;
    }
    names.forEach(function (n) {
      var li = document.createElement('li');
      li.textContent = n;
      listEl.appendChild(li);
    });
  }

  function render() {
    var key = selectEl.value;
    var plan = PLANS[key];
    var required = requiredFor(key);
    var presentNames = STAFF.filter(function (n) { return present.has(n); });
    var absentNames = STAFF.filter(function (n) { return !present.has(n); });
    var count = presentNames.length;
    var diff = count - required;

    document.getElementById('vRequired').textContent = required;
    document.getElementById('vPresent').textContent = count;

    var vEl = document.getElementById('vVariance');
    vEl.textContent = diff > 0 ? '+' + diff : String(diff);
    vEl.className = 'v ' + (diff === 0 ? 'is-good' : diff < 0 ? 'is-short' : 'is-over');

    document.getElementById('status').textContent =
      diff === 0 ? 'On plan' : diff < 0 ? (-diff) + ' short of plan' : '+' + diff + ' over plan';
    document.getElementById('breakdown').textContent =
      key + ' — ' + plan.unloaders + ' unloaders + ' + plan.sweeps + ' bulk sweeps = ' + required + ' required';

    document.getElementById('cPresent').textContent = count;
    document.getElementById('cAbsent').textContent = absentNames.length;
    fill(document.getElementById('listPresent'), presentNames);
    fill(document.getElementById('listAbsent'), absentNames);
    document.getElementById('stamp').textContent = new Date().toLocaleDateString();
  }

  function setPresent(name, on, btn) {
    if (on) { present.add(name); btn.classList.add('present'); }
    else { present.delete(name); btn.classList.remove('present'); }
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function init() {
    STAFF.forEach(function (name) {
      var btn = document.createElement('button');
      btn.className = 'employee-btn';
      btn.type = 'button';
      btn.textContent = name;
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', function () {
        setPresent(name, !present.has(name), btn);
        render();
      });
      rosterEl.appendChild(btn);
    });

    selectEl.addEventListener('change', render);
    document.getElementById('markAll').addEventListener('click', function () {
      Array.prototype.forEach.call(rosterEl.children, function (btn) { setPresent(btn.textContent, true, btn); });
      render();
    });
    document.getElementById('clearAll').addEventListener('click', function () {
      Array.prototype.forEach.call(rosterEl.children, function (btn) { setPresent(btn.textContent, false, btn); });
      render();
    });

    render();
  }

  init();
</script>
</body>
</html>
